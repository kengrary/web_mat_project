[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jvmind-mat-mcp"
version = "0.2.1"
description = "Local MCP server for Eclipse MAT heapdump analysis and live JVM capture"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "JVMind" }]
keywords = ["mcp", "heapdump", "jvm", "eclipse-mat", "oom"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Debuggers",
]
dependencies = [
  "mcp>=2,<3",
  "httpx>=0.27,<1",
  "filelock>=3.13",
  "platformdirs>=4.0",
  "pydantic>=2,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "ruff>=0.6",
  "build>=1.2",
  "twine>=5",
]

[project.scripts]
jvmind-mat-mcp = "jvmind_mat_mcp.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
jvmind_mat_mcp = ["vendor/*.jar"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
  "integration: requires a real Eclipse MAT installation and hprof fixture",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]
