<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JVMind Heapdump Analyzer — 原型</title>
<style>
  /* 全部内联，无外部资源（兼容沙箱预览 iframe） */
  * { box-sizing: border-box; }
  :root {
    --bg:#1e1e2e; --panel:#282a36; --panel2:#21222c; --line:#3a3d4d;
    --fg:#e0e0e0; --muted:#9aa0b0; --accent:#7aa2f7; --accent2:#bb9af7;
    --bar:#3b4261; --barfill:#7aa2f7; --ok:#9ece6a; --warn:#e0af68; --err:#f7768e;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--fg);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, "PingFang SC", "Microsoft YaHei", sans-serif; font-size:13px; }
  #app { display:grid; grid-template-rows:auto 1fr; height:100vh; }

  /* 顶部工具条 */
  .toolbar { display:flex; align-items:center; gap:12px; padding:8px 12px; background:var(--panel2);
    border-bottom:1px solid var(--line); }
  .toolbar .title { font-weight:600; color:var(--accent2); }
  .toolbar .spacer { flex:1; }
  .toolbar input, .toolbar select, .toolbar button {
    background:var(--panel); color:var(--fg); border:1px solid var(--line); border-radius:6px;
    padding:5px 9px; font-size:12px; }
  .toolbar button { cursor:pointer; }
  .toolbar button:hover { border-color:var(--accent); }
  .badge { font-size:11px; padding:2px 7px; border-radius:10px; }
  .badge.mock { background:#3a2f1a; color:var(--warn); }
  .badge.live { background:#1a3a23; color:var(--ok); }

  /* 三区布局 */
  .layout { display:grid; grid-template-columns:200px 1fr 300px; height:100%; overflow:hidden; }
  .nav { background:var(--panel2); border-right:1px solid var(--line); padding:8px; overflow:auto; }
  .nav h4 { color:var(--muted); font-size:11px; text-transform:uppercase; margin:12px 6px 4px; }
  .nav .item { padding:7px 10px; border-radius:6px; cursor:pointer; display:flex; gap:8px; align-items:center; }
  .nav .item:hover { background:var(--panel); }
  .nav .item.active { background:var(--bar); color:var(--accent); }
  .nav .item .ico { width:14px; text-align:center; opacity:.8; }

  .center { display:grid; grid-template-rows:auto 1fr; overflow:hidden; }
  .tabs { display:flex; gap:2px; background:var(--panel2); border-bottom:1px solid var(--line); padding:4px 6px 0; overflow-x:auto; }
  .tab { padding:6px 12px; background:var(--panel); border:1px solid var(--line); border-bottom:none;
    border-radius:6px 6px 0 0; cursor:pointer; white-space:nowrap; display:flex; gap:8px; align-items:center; color:var(--muted); }
  .tab.active { background:var(--bg); color:var(--fg); }
  .tab .x { opacity:.5; } .tab .x:hover { opacity:1; color:var(--err); }
  .view { overflow:auto; padding:0; position:relative; }

  .inspector { background:var(--panel2); border-left:1px solid var(--line); overflow:auto; padding:12px; }
  .inspector h3 { font-size:12px; color:var(--accent2); margin:0 0 8px; }
  .inspector .empty { color:var(--muted); font-style:italic; }
  .kv { display:grid; grid-template-columns:90px 1fr; gap:4px 8px; font-size:12px; margin-bottom:10px; }
  .kv .k { color:var(--muted); } .kv .v { font-family:var(--mono); word-break:break-all; }
  .insp-actions button { width:100%; text-align:left; margin:3px 0; background:var(--panel);
    color:var(--fg); border:1px solid var(--line); border-radius:6px; padding:6px 9px; cursor:pointer; font-size:12px; }
  .insp-actions button:hover { border-color:var(--accent); color:var(--accent); }
  .reflist { font-size:12px; margin-bottom:10px; }
  .refrow { padding:3px 4px; border-radius:4px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .refrow:hover { background:var(--panel); }
  .refrow .rn { color:var(--accent2); font-family:var(--mono); margin-right:4px; }
  .reflink { color:var(--accent); text-decoration:none; cursor:pointer; }
  .reflink:hover { text-decoration:underline; }
  .more { color:var(--muted); font-style:italic; padding:2px 4px; }
  .rsbar { background:var(--panel); border:1px solid var(--accent); border-radius:8px;
    padding:8px 12px; margin:8px 12px; display:flex; gap:8px; align-items:center; flex-wrap:wrap; font-size:12px; }
  .rsbar code { background:var(--panel2); padding:1px 5px; border-radius:4px; color:var(--accent2); }
  .rsbar button { background:var(--panel2); color:var(--accent); border:1px solid var(--line);
    border-radius:6px; padding:5px 10px; cursor:pointer; }
  .rsbar button:hover { border-color:var(--accent); }
  .sqlcard { margin:8px 12px; border:1px solid var(--line); border-radius:8px; background:var(--panel); cursor:pointer; overflow:hidden; }
  .sqlcard:hover { border-color:var(--accent); }
  .sqlhead { display:flex; gap:10px; align-items:center; padding:8px 12px; background:var(--panel2); flex-wrap:wrap; }
  .sqlthread { color:var(--accent2); font-size:12px; }
  .tret { font-size:11px; font-family:var(--mono); color:var(--muted); }
  .tret.big { color:var(--err); font-weight:600; }
  .sqlsrc { color:var(--muted); font-size:11px; margin-left:auto; }
  .sqltext { margin:0; padding:10px 12px; font-family:var(--mono); font-size:12px; color:var(--ok);
    white-space:pre-wrap; word-break:break-all; background:var(--bg); }
  .sqlmeta { padding:6px 12px; font-size:11px; color:var(--muted); }
  .sqlframe { font-family:var(--mono); }
  .poolcard { margin:10px 16px; border:1px solid var(--line); border-radius:8px; background:var(--panel); padding:10px 14px; }
  .poolhead { display:flex; gap:10px; align-items:center; margin-bottom:6px; }
  .poolinspect { margin-left:auto; background:var(--panel2); color:var(--accent); border:1px solid var(--line); border-radius:6px; padding:4px 10px; cursor:pointer; font-size:12px; }
  .poolinspect:hover { border-color:var(--accent); }
  .poolcard h4 { font-size:11px; text-transform:uppercase; }
  .leakcard { margin:8px 16px; border:1px solid var(--line); border-radius:8px; background:var(--panel); padding:8px 12px; cursor:pointer; }
  .leakcard.leak { border-color:var(--err); background:#3a1a1f; }
  .leakcard:hover { border-color:var(--accent); }
  .leakhead { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .leakstack { margin-top:6px; font-family:var(--mono); font-size:11px; color:var(--ok); line-height:1.7; }
  .leakmeta { margin-top:6px; font-size:11px; color:var(--muted); }
  .connrow { padding:4px 8px; margin:2px 0; border-radius:5px; font-family:var(--mono); font-size:12px; cursor:pointer; }
  .connrow:hover { background:var(--bar); }
  .connrow.active { color:var(--accent); }
  .oombanner { margin:12px 16px; padding:12px 14px; border-radius:8px; font-size:13px; line-height:1.6; }
  .oombanner.culprit { background:#3a1a1f; border:1px solid var(--err); }
  .oombanner.victim { background:#3a2f1a; border:1px solid var(--warn); }
  .oombanner code { background:rgba(0,0,0,.3); padding:1px 5px; border-radius:4px; }
  /* Inspector 字段表（Type/Name/Value + 搜索 + 排序） */
  .field-search { width:100%; margin:4px 0 6px; background:var(--panel); color:var(--fg);
    border:1px solid var(--line); border-radius:6px; padding:5px 8px; font-size:12px; }
  .ftbl { border:1px solid var(--line); border-radius:6px; overflow:hidden; margin-bottom:12px; font-size:12px; }
  .fhead { display:flex; background:var(--panel2); border-bottom:1px solid var(--line);
    color:var(--muted); font-size:11px; text-transform:uppercase; }
  .fhead .fc { padding:5px 8px; cursor:pointer; user-select:none; }
  .fhead .fc:hover { color:var(--accent); }
  .fhead .fc.sorted { color:var(--accent); }
  .frow { display:flex; border-bottom:1px solid #2a2c3a; }
  .frow:last-child { border-bottom:none; }
  .frow:hover { background:var(--panel); }
  .fc.type { width:60px; color:var(--accent2); font-family:var(--mono); flex-shrink:0; }
  .fc.name { width:110px; flex-shrink:0; overflow:hidden; text-overflow:ellipsis; }
  .fc.val  { flex:1; min-width:0; font-family:var(--mono); word-break:break-all; }
  .valbox { background:var(--panel); border:1px solid var(--line); border-radius:6px;
    padding:8px 10px; font-family:var(--mono); font-size:12px; word-break:break-all;
    white-space:pre-wrap; max-height:160px; overflow:auto; margin-bottom:10px; color:var(--ok); }

  /* 概览卡片 */
  .cards { display:grid; grid-template-columns:repeat(auto-fill,minmax(160px,1fr)); gap:12px; padding:16px; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:14px; }
  .card .num { font-size:22px; font-weight:600; color:var(--accent); }
  .card .lbl { color:var(--muted); font-size:11px; margin-top:4px; }

  /* 表格 / 树 */
  .grid { width:100%; }
  .ghead { position:sticky; top:0; background:var(--panel2); display:flex; border-bottom:1px solid var(--line);
    font-size:11px; color:var(--muted); text-transform:uppercase; z-index:2; }
  .ghead .gc { padding:8px 10px; cursor:pointer; user-select:none; }
  .ghead .gc:hover { color:var(--accent); }
  .grow { display:flex; border-bottom:1px solid #2a2c3a; cursor:pointer; }
  .grow:hover { background:var(--panel); }
  .grow.sel { background:var(--bar); }
  .gc { padding:6px 10px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .gc.num { text-align:right; font-family:var(--mono); }
  .gc.name { flex:1; min-width:0; }
  .bar { height:4px; background:var(--bar); border-radius:2px; margin-top:3px; }
  .bar > i { display:block; height:100%; background:var(--barfill); border-radius:2px; }
  .twig { color:var(--muted); display:inline-block; width:16px; text-align:center; }
  .pill { font-size:10px; padding:1px 5px; border-radius:8px; background:#2a2c3a; color:var(--muted); margin-left:6px; }
  .approx { color:var(--warn); }

  /* 右键菜单 */
  .ctx { position:fixed; background:var(--panel); border:1px solid var(--line); border-radius:8px;
    box-shadow:0 6px 24px rgba(0,0,0,.4); padding:4px; z-index:100; min-width:200px; }
  .ctx .mi { padding:7px 12px; border-radius:6px; cursor:pointer; font-size:12px; }
  .ctx .mi:hover { background:var(--bar); color:var(--accent); }
  .ctx .sep { height:1px; background:var(--line); margin:4px 0; }

  .loading { padding:20px; color:var(--muted); }
  .toast { position:fixed; bottom:16px; left:50%; transform:translateX(-50%); background:var(--panel);
    border:1px solid var(--accent); border-radius:8px; padding:10px 16px; z-index:200; }
  .note { padding:14px 16px; color:var(--muted); font-size:12px; line-height:1.6; }
  .note code { background:var(--panel); padding:1px 5px; border-radius:4px; font-family:var(--mono); color:var(--accent); }
</style>
</head>
<body>
<div id="app">
  <div class="toolbar">
    <span class="title">🔬 JVMind Heapdump Analyzer</span>
    <span class="badge mock" id="modeBadge">MOCK 数据</span>
    <span class="spacer"></span>
    <label style="color:var(--muted);font-size:12px">后端</label>
    <input id="baseUrl" value="http://127.0.0.1:8090" style="width:170px" title="query-service 地址">
    <input id="dumpDir" value="/path/to/dump" style="width:160px" title="dump 目录(含 hprof+index)">
    <button id="connectBtn">连接真实后端</button>
  </div>

  <div class="layout">
    <!-- 左：类 MAT 菜单 -->
    <div class="nav" id="nav">
      <h4>概览</h4>
      <div class="item active" data-view="overview"><span class="ico">📊</span>Overview</div>
      <h4>视图</h4>
      <div class="item" data-view="histogram"><span class="ico">📈</span>Histogram</div>
      <div class="item" data-view="dominator"><span class="ico">🌲</span>Dominator Tree</div>
      <div class="item" data-view="threads"><span class="ico">🧵</span>Threads</div>
      <div class="item" data-view="threadlocals"><span class="ico">🧷</span>ThreadLocals</div>
      <h4>诊断</h4>
      <div class="item" data-view="diagnoseOom"><span class="ico">🧪</span>OOM 复合诊断</div>
      <div class="item" data-view="leak"><span class="ico">🩺</span>Leak Suspects</div>
      <div class="item" data-view="sql"><span class="ico">🗄️</span>SQL in Threads</div>
      <div class="item" data-view="pools"><span class="ico">🔌</span>Connection Pools</div>
      <div class="item" data-view="oql"><span class="ico">🔎</span>OQL</div>
    </div>

    <!-- 中：Tab 容器 -->
    <div class="center">
      <div class="tabs" id="tabs"></div>
      <div class="view" id="view"></div>
    </div>

    <!-- 右：Inspector -->
    <div class="inspector" id="inspector">
      <h3>Inspector</h3>
      <div class="empty">选中某个对象查看详情</div>
    </div>
  </div>
</div>

<script>
/* =========================================================================
   说明：本原型默认用 MOCK 数据（内置，数值来自真实 dump 实测），
   连不到后端也能完整演示交互。点"连接真实后端"切到 query-service。
   —— 演示重点：虚拟滚动表 + 懒加载树 + Tab + 右键联动 + Inspector。
   ========================================================================= */

const State = { live:false, base:'', dumpDir:'', tabs:[], activeTab:null, selected:null };

/* ---------- 后端适配层：mock 或 真实 fetch ---------- */
const API = {
  async overview() {
    if (!State.live) return MOCK.overviewFull;
    return fetchJSON(`/overview?dumpDir=${enc(State.dumpDir)}&full=true`);
  },
  async histogram(top=200, offset=0, sort='shallow', objectSet=null) {
    if (!State.live) return MOCK.histogram(top, offset, sort, objectSet);
    const os = objectSet ? `&objectSet=${enc(objectSet)}` : '';
    return fetchJSON(`/histogram?dumpDir=${enc(State.dumpDir)}&top=${top}&offset=${offset}&sort=${sort}${os}`);
  },
  async retainedSet(objectSet) {  // 演示：对结果集算 retained（真实为异步 taskId，这里简化）
    if (!State.live) return MOCK.retainedSet(objectSet);
    return fetchJSON(`/retained-set?dumpDir=${enc(State.dumpDir)}&objectSet=${enc(objectSet)}`, 'POST', '{}');
  },
  async dominator(parent='ROOT', top=100, offset=0) {
    if (!State.live) return MOCK.dominator(parent, top, offset);
    return fetchJSON(`/dominator?dumpDir=${enc(State.dumpDir)}&parent=${parent}&top=${top}&offset=${offset}`);
  },
  async threads() {
    if (!State.live) return MOCK.threads();
    return fetchJSON(`/threads?dumpDir=${enc(State.dumpDir)}`);
  },
  async threadFrames(threadId) {
    if (!State.live) return MOCK.threadFrames(threadId);
    return fetchJSON(`/threads?dumpDir=${enc(State.dumpDir)}&thread=${threadId}`);
  },
  async threadLocals(threadId, frameIdx) {
    if (!State.live) return MOCK.threadLocals(threadId, frameIdx);
    return fetchJSON(`/threads?dumpDir=${enc(State.dumpDir)}&thread=${threadId}&frame=${frameIdx}`);
  },
  async object(id) {
    if (!State.live) return MOCK.object(id);
    return fetchJSON(`/object?dumpDir=${enc(State.dumpDir)}&id=${id}`);  // 后端 ObjectView
  },
  async oql(q, view='list', sort='') {
    if (!State.live) return MOCK.oql(q, view, sort);
    return fetchJSON(`/oql?dumpDir=${enc(State.dumpDir)}&view=${view}&sort=${sort}`, 'POST',
      JSON.stringify({q, limit:200, offset:0}));
  },
  async threadlocals(groupBy='valueClass') {
    if (!State.live) return MOCK.threadlocals(groupBy);
    return fetchJSON(`/threadlocals?dumpDir=${enc(State.dumpDir)}&groupBy=${groupBy}&top=100`);
  },
  async sqlInThreads(onlyRisky=true) {
    if (!State.live) return MOCK.sqlInThreads(onlyRisky);
    return fetchJSON(`/sql-in-threads?dumpDir=${enc(State.dumpDir)}&onlyRisky=${onlyRisky}`);
  },
  async oomDiagnosis() {
    if (!State.live) return MOCK.oomDiagnosis();
    return fetchJSON(`/oom-diagnosis?dumpDir=${enc(State.dumpDir)}`);
  },
  async diagnoseOom() {
    if (!State.live) return MOCK.diagnoseOom();
    // 真实后端：异步任务（含 leakhunter）→ 提交拿 taskId，轮询 /tasks/{id}
    const sub = await fetchJSON(`/diagnose-oom?dumpDir=${enc(State.dumpDir)}`);
    return pollTask(sub.taskId);
  },
  async connectionPools() {
    if (!State.live) return MOCK.connectionPools();
    return fetchJSON(`/connection-pools?dumpDir=${enc(State.dumpDir)}`);
  },
  async poolLeaks() {
    if (!State.live) return MOCK.poolLeaks();
    return fetchJSON(`/pool-leaks?dumpDir=${enc(State.dumpDir)}`);
  }
};
function enc(s){ return encodeURIComponent(s); }
async function fetchJSON(path, method='GET', body=null){
  const r = await fetch(State.base + path, {method, headers:{'Content-Type':'application/json'}, body});
  if (!r.ok) throw new Error('HTTP '+r.status);
  return r.json();
}
/* 异步任务轮询：提交后拿 taskId → 轮询 /tasks/{id} 直到 DONE/ERROR，返回 result。 */
async function pollTask(taskId, intervalMs=1000, maxTries=600){
  for(let i=0;i<maxTries;i++){
    const t = await fetchJSON(`/tasks/${enc(taskId)}`);
    if(t.status==='DONE'){
      if(t.resultEvicted) throw new Error('结果已被回收（软引用），请重新发起诊断');
      return t.result;
    }
    if(t.status==='FAILED'||t.status==='CANCELLED'||t.status==='NOT_FOUND')
      throw new Error(t.error||('task '+t.status));
    await sleep(intervalMs);   // RUNNING → 继续轮询
  }
  throw new Error('task timeout');
}

/* ---------- MOCK 数据（数值来自真实 dump 实测） ---------- */
const MOCK = {
  overview: { numObjects:6094, numClasses:565, numClassLoaders:3, numGcRoots:530,
    usedHeapSize:300920, usedHeapSizeHuman:'293.9 KB', jvmInfo:'Java HotSpot 1.8.0_05 (x64)' },
  overviewFull: { numObjects:6094, numClasses:565, numClassLoaders:3, numGcRoots:530,
    usedHeapSize:300920, usedHeapSizeHuman:'293.9 KB', jvmInfo:'Java HotSpot(TM) 64-Bit Server VM (1.8.0_05)',
    identifierSize:8, useCompressedOops:'true', heapFormat:'hprof', creationDate:'2026-06-28 13:00:00',
    filePath:'/nfs/heapdumps/hd_x/app.hprof', fileLength:'5.1 MB',
    systemProperties:[
      {name:'java.version', value:'1.8.0_05'},
      {name:'java.vm.name', value:'Java HotSpot(TM) 64-Bit Server VM'},
      {name:'os.name', value:'Linux'},
      {name:'os.arch', value:'amd64'},
      {name:'user.timezone', value:'Asia/Shanghai'},
      {name:'file.encoding', value:'UTF-8'},
      {name:'user.name', value:'appuser'},
      {name:'sun.java.command', value:'com.example.App --port 8080'},
    ]},
  _hist: [
    ['char[]',1555,145088,150000,true],['java.lang.String',1533,36792,140200,true],
    ['byte[]',7,24960,24960,false],['java.lang.Object[]',328,14232,42000,true],
    ['java.lang.Class',574,7272,9100,false],['java.util.HashMap$Node',420,13440,30000,true],
    ['java.lang.Integer',300,4800,4800,false],['int[]',45,9200,9200,false],
    ['java.util.HashMap',88,4224,28000,true],['java.lang.reflect.Method',210,16800,16800,false],
    ['java.util.concurrent.ConcurrentHashMap$Node',150,4800,9000,true],
    ['java.lang.ref.SoftReference',60,2400,2400,false],['java.util.ArrayList',95,2280,15000,true],
    ['com.example.CacheManager',1,48,180000,true],['com.example.Connection',50,1600,52000,true],
  ],
  histogram(top, offset, sort, objectSet){
    // 对结果集做直方图：返回 OQL 那批对象的类聚合（演示分析流复用）
    if(objectSet){
      const rows=[
        {classId:2001,label:'com.example.Connection',count:2,shallowBytes:64,shallow:human(64),retainedBytes:3200,retained:human(3200),retainedApprox:false},
        {classId:2002,label:'java.lang.String',count:2,shallowBytes:48,shallow:human(48),retainedBytes:132,retained:human(132),retainedApprox:false},
        {classId:2003,label:'char[]',count:1,shallowBytes:256,shallow:human(256),retainedBytes:256,retained:human(256),retainedApprox:false},
      ];
      const key= sort==='count'?'count':(sort==='retained'?'retainedBytes':'shallowBytes');
      rows.sort((a,b)=>b[key]-a[key]);
      return {groupBy:'class',sort:sort||'shallow',rows,totalRows:rows.length,returned:rows.length,cursor:null};
    }
    let rows = MOCK._hist.map((r,i)=>({classId:1000+i, label:r[0], count:r[1],
      shallowBytes:r[2], shallow:human(r[2]), retainedBytes:r[3], retained:human(r[3]), retainedApprox:r[4]}));
    const key = sort==='count'?'count':(sort==='retained'?'retainedBytes':'shallowBytes');
    rows.sort((a,b)=>b[key]-a[key]);
    const total=rows.length; const slice=rows.slice(offset, offset+top);
    return {groupBy:'class', sort, rows:slice, totalRows:total, returned:slice.length,
      cursor: offset+top<total ? 'offset:'+(offset+top):null};
  },
  _domRoot: [
    [5567,'com.example.CacheManager @ 0x7f3c',180000,48,59.8,true],
    [88,'Thread "http-nio-8080-exec-7" @ 0x6a1',52000,512,17.3,true],
    [120,'java.util.HashMap @ 0x6b2',28000,48,9.3,true],
    [301,'java.lang.Object[] @ 0x6c3',14000,40,4.7,true],
    [410,'byte[] @ 0x6d4',9000,9000,3.0,false],
  ],

function human(b){ if(b<1024)return b+' B'; const u=['KB','MB','GB']; let v=b,i=-1;

/* ---------- Tab 管理 ---------- */
function openView(type, params={}, title=null){
  const id = type+':'+JSON.stringify(params);
  let tab = State.tabs.find(t=>t.id===id);
  if (!tab){ tab={id, type, params, title: title||defaultTitle(type,params)}; State.tabs.push(tab); }
  State.activeTab = id; renderTabs(); renderView();
}
function closeTab(id, ev){ ev.stopPropagation();
  const i=State.tabs.findIndex(t=>t.id===id); if(i<0)return;
  State.tabs.splice(i,1);
  if(State.activeTab===id) State.activeTab = State.tabs.length? State.tabs[Math.max(0,i-1)].id : null;
  renderTabs(); renderView();
}
function defaultTitle(type, p){
  if(type==='sql') return 'SQL in Threads';
  if(type==='pools') return 'Connection Pools';
  const m={overview:'Overview',histogram:'Histogram',dominator:'Dominator Tree',
    threads:'Threads',threadlocals:'ThreadLocals',leak:'Leak Suspects',oql:'OQL',
    diagnoseOom:'OOM 复合诊断'};
  if(type==='path2gc') return 'Path→GC #'+p.objectId;
  if(type==='outbound') return 'Outbound #'+p.objectId;
  if(type==='threadlocals') return 'ThreadLocals'+(p.groupBy==='thread'?' (按线程)':'');
  if(type==='histogramOfSet') return 'Histogram of set';
  if(type==='histogramOfRS') return 'Histogram of '+(p.rs||'set');
  return m[type]||type;
}
function renderTabs(){
  const el=document.getElementById('tabs'); el.innerHTML='';
  State.tabs.forEach(t=>{
    const d=document.createElement('div'); d.className='tab'+(t.id===State.activeTab?' active':'');
    d.innerHTML=`<span>${esc(t.title)}</span><span class="x">✕</span>`;
    d.onclick=()=>{State.activeTab=t.id; renderTabs(); renderView();};
    d.querySelector('.x').onclick=(e)=>closeTab(t.id,e);
    el.appendChild(d);
  });
}

/* ---------- 视图渲染 ---------- */
async function renderView(){
  const host=document.getElementById('view');
  const tab=State.tabs.find(t=>t.id===State.activeTab);
  if(!tab){ host.innerHTML='<div class="note">左侧选择一个视图开始分析。</div>'; return; }
  host.innerHTML='<div class="loading">加载中…</div>';
  try{
    if(tab.type==='overview') return renderOverview(host);
    if(tab.type==='histogram') return renderHistogram(host, tab);
    if(tab.type==='dominator') return renderDominator(host, tab);
    if(tab.type==='threads') return renderThreads(host, tab);
    if(tab.type==='threadlocals') return renderThreadLocals(host, tab);
    if(tab.type==='diagnoseOom') return renderDiagnoseOom(host);
    if(tab.type==='leak') return renderLeak(host);
    if(tab.type==='sql') return renderSql(host, tab);
    if(tab.type==='pools') return renderPools(host, tab);
    if(tab.type==='oql') return renderOql(host);
    if(tab.type==='path2gc') return renderPath2gc(host, tab);
    if(tab.type==='histogramOfSet') return renderHistogram(host, tab);
    if(tab.type==='histogramOfRS') return renderHistogramOfRS(host, tab);
    host.innerHTML='<div class="note">视图 '+tab.type+' 原型未实现（真实后端有对应端点）。</div>';
  }catch(e){ host.innerHTML='<div class="note" style="color:var(--err)">出错：'+esc(e.message)+
    '<br>（MOCK 模式下应不会出错；真实模式请检查后端连通与 dumpDir）</div>'; }
}

      oomBanner=`<div class="oombanner ${isCulprit?'culprit':'victim'}">
        <b>${isCulprit?'🔴 疑似 OOM 元凶':'🟡 触发线程是受害者'}</b> —
        线程 <code>${esc(t.threadName)}</code>（retained ${esc(t.retained)} / ${t.percentHeap}% 堆）<br>
        <span style="color:var(--muted)">${esc(t.reason)} · ${esc(t.triggerFrame||'')}</span>
        ${!isCulprit&&d.culpritHint?`<br>真正大头：<code>${esc(d.culpritHint.threadName)}</code> ${esc(d.culpritHint.retained)} (${d.culpritHint.percentHeap}%)`:''}

    ${card(o.numClasses,'类数')}
    ${card(o.numClassLoaders,'类加载器')}

async function addDomLevel(container, parent, depth){
  const data=await API.dominator(parent,100,0);
  data.rows.forEach(r=>{
    const row=document.createElement('div'); row.className='grow';
    row.style.paddingLeft=(depth*16)+'px';
    const tw = r.expandable? '▸':'·';
    row.innerHTML=`<div class="gc name"><span class="twig" data-tw>${tw}</span>${esc(r.label)}
        <div class="bar"><i style="width:${Math.min(100,r.percent)}%"></i></div></div>
      <div class="gc num" style="width:120px">${r.retained}</div>
      <div class="gc num" style="width:90px">${r.percent}%</div>`;
    let expanded=false, childWrap=null;
    const tws=row.querySelector('[data-tw]');
    row.onclick=()=>selectObj(r, row);
    if(r.expandable){
      tws.style.cursor='pointer';
      tws.onclick=async(e)=>{ e.stopPropagation();
        if(!expanded){ childWrap=document.createElement('div');

/* Threads：三级树（简化为两级演示：线程→栈帧/局部变量提示） */
async function renderThreads(host, tab){

      t.retained);
    row.onclick=()=>selectObj({objectId:t.objectId, label:t.name, type:'java.lang.Thread', retained:t.retained}, row);

// 二级：栈帧
async function addFrames(container, threadId){
  const data=await API.threadFrames(threadId);
  if(!data.frames.length){ container.appendChild(mkRow(1,'·','<span style="color:var(--muted)">（无栈帧信息）</span>','')); return; }
  data.frames.forEach(f=>{
    const hasLocals = f.localsCount>0;
    const row=mkRow(1, hasLocals?'▸':'·',
      `<span style="font-family:var(--mono);font-size:12px">${esc(f.text)}</span>`+
      (hasLocals?`<span class="pill">${f.localsCount} locals</span>`:''),
      f.maxLocalRetained||'');
    let expanded=false, wrap=null;
    if(hasLocals){
      const tw=row.querySelector('[data-tw]'); tw.style.cursor='pointer';
      tw.onclick=async(e)=>{ e.stopPropagation();
        if(!expanded){ wrap=document.createElement('div'); row.after(wrap); tw.textContent='▾';
          await addLocals(wrap, threadId, f.frameIdx); expanded=true; }
        else { wrap.remove(); wrap=null; tw.textContent='▸'; expanded=false; } };
    }
    container.appendChild(row);
  });
}
// 三级：局部变量（对象）
async function addLocals(container, threadId, frameIdx){
  const data=await API.threadLocals(threadId, frameIdx);
  if(!data.locals.length){ container.appendChild(mkRow(2,'·','<span style="color:var(--muted)">（无局部变量）</span>','')); return; }
  data.locals.forEach(o=>{

    container.appendChild(row);

}

/* 简易 "523.4 KB" → 字节，用于画占比条 */
function parseBytes(s){ if(!s) return 0; const m=/([\d.]+)\s*(B|KB|MB|GB)/.exec(s); if(!m) return 0;
  const u={B:1,KB:1024,MB:1048576,GB:1073741824}; return parseFloat(m[1])*u[m[2]]; }

/* SQL in Threads（SQL 引起的 OOM 排查）：从线程栈帧局部变量提取 SQL，按风险标记 */
/* Connection Pools：连接池配置 + 统计 + 泄漏归因（密码已脱敏，识别主流池） */
async function renderPools(host, tab){
  const data = await API.connectionPools();
  if(!data.count){ host.innerHTML='<div class="note">未发现已知连接池（HikariCP/Druid/Tomcat JDBC/DBCP2/c3p0）。</div>'; return; }
  let html=`<div class="note">发现 ${data.count} 个连接池。密码等敏感字段已脱敏为 ******。</div>`;
  data.pools.forEach(p=>{
    const kvTable=(title,list)=> list&&list.length? `<h4 style="margin:8px 0 4px;color:var(--muted)">${title}</h4>
      <div class="kv">${list.map(r=>`<div class="k">${esc(r.name)}</div>
        <div class="v">${r.value==='******'?'<span style="color:var(--warn)">••••••</span>':esc(String(r.value))}</div>`).join('')}</div>`:'';
    // 空闲/活跃连接区分（Druid: holder/pooledConnection；HikariCP: PoolEntry.state）
    const connMeta=(x)=>{
      const parts=[];
      if(x.useCount!=null) parts.push('useCount '+esc(String(x.useCount)));
      if(x.state) parts.push(esc(String(x.state)));
      if(x.hasBorrowStack) parts.push('有借出栈');
      return parts.length? ' · '+parts.join(' · '):'';
    };
    const connTable=(c)=> !c ? '' : `
      <h4 style="margin:8px 0 4px;color:var(--muted)">空闲连接 Idle (${c.idleCount!=null?c.idleCount:(c.idle?c.idle.length:0)})</h4>
      ${(c.idle&&c.idle.length)? c.idle.map(x=>`<div class="connrow idle" data-cid="${x.connId}">
          🟢 conn #${x.connId}${connMeta(x)}</div>`).join('') : '<div class="note">无</div>'}
      <h4 style="margin:8px 0 4px;color:var(--muted)">活跃连接 Active (${c.activeCount!=null?c.activeCount:(c.active?c.active.length:0)})</h4>
      ${(c.active&&c.active.length)? c.active.map(x=>`<div class="connrow active" data-cid="${x.connId}">
          🔵 conn #${x.connId}${connMeta(x)}</div>`).join('') : '<div class="note">无</div>'}
      ${c.note?`<div class="leakmeta" style="margin-top:6px">${esc(c.note)}</div>`:''}`;
    html+=`<div class="poolcard">
      <div class="poolhead"><span class="pill" style="color:var(--accent)">${esc(p.type)}</span>
        <b>${esc(p.label)}</b>
        <button data-oid="${p.objectId}" class="poolinspect">Inspect →</button></div>
      ${kvTable('配置 Config', p.config)}
      ${kvTable('统计 Stats', p.stats)}
      ${connTable(p.connections)}
    </div>`;
  });
  // 泄漏归因区
  html += `<h3 style="margin:16px 16px 4px;color:var(--accent2)">🔍 泄漏归因（借出未归还的连接）</h3>
    <div id="leakbox" class="note">检测中…</div>`;
  host.innerHTML=html;
  host.querySelectorAll('.poolinspect').forEach(b=>b.onclick=()=>selectObj({objectId:parseInt(b.dataset.oid),label:'pool'}));
  host.querySelectorAll('.connrow[data-cid]').forEach(r=>{
    r.onclick=()=>selectObj({objectId:parseInt(r.dataset.cid),label:'connection'}, r);
    r.oncontextmenu=(e)=>rowMenu(e,{objectId:parseInt(r.dataset.cid)});
  });

  // 异步加载泄漏归因
  try{
    const lk = await API.poolLeaks();
    const box = host.querySelector('#leakbox'); box.className='';
    if(!lk.connections || !lk.connections.length){ box.className='note'; box.innerHTML='无借出中的连接。'; return; }
    let lh=`<div class="note">借出中 ${lk.borrowedTotal} 个连接，<b style="color:var(--err)">${lk.suspectedLeaks} 个疑似泄漏</b>（借出超 ${Math.round(lk.thresholdMs/60000)} 分钟）。按借出时长降序。</div>`;
    lk.connections.forEach(c=>{
      const leak=c.suspectedLeak;
      lh+=`<div class="leakcard ${leak?'leak':''}" data-cid="${c.connectionId}">
        <div class="leakhead">${leak?'<span class="pill" style="color:var(--err)">⚠ 疑似泄漏</span>':'<span class="pill">借出中</span>'}
          <span class="pill">${esc(c.pool)}</span>
          <span style="color:var(--muted)">借出 ${esc(c.borrowedAge)}</span>
          <span style="color:var(--muted);font-family:var(--mono)">${esc(c.label)}</span></div>
        ${c.borrowStack&&c.borrowStack.length?`<div class="leakstack">借出栈（泄漏点）：<br>${c.borrowStack.map(f=>esc(f)).join('<br>')}</div>`
          :`<div class="leakmeta">${esc(c.borrowStackHint||'')} · 用 Path to GC Roots 看谁持有它</div>`}
      </div>`;
    });
    box.innerHTML=lh;
    box.querySelectorAll('.leakcard[data-cid]').forEach(card=>{
      card.onclick=()=>selectObj({objectId:parseInt(card.dataset.cid),label:'connection'}, card);
      card.oncontextmenu=(e)=>rowMenu(e,{objectId:parseInt(card.dataset.cid)});
    });
  }catch(e){ const box=host.querySelector('#leakbox'); box.className='note'; box.innerHTML='泄漏归因加载失败：'+esc(e.message); }
}

async function renderSql(host, tab){
  const onlyRisky = tab.params.onlyRisky !== false;
  const data = await API.sqlInThreads(onlyRisky);
  const badge = (r)=>{
    const m={risky:['⚠ 高风险','var(--err)'],unknown:['? 待评估','var(--warn)'],harmless:['✓ 无害','var(--muted)']};
    const [t,c]=m[r]||m.unknown; return `<span class="pill" style="color:${c}">${t}</span>`;
  };
  let html=`<div style="padding:8px 12px;display:flex;gap:10px;align-items:center">
      <label style="color:var(--muted)"><input type="checkbox" id="riskyOnly" ${onlyRisky?'checked':''}> 只看有风险</label>
      <span style="color:var(--muted)">共 ${data.total} 条 SQL，${data.risky} 条高风险</span>
    </div>
    <div class="note">从各线程栈帧局部变量提取正在执行的 SQL。
    <b>高风险</b>=SELECT */无WHERE/无分页 → 疑似大结果集导致 OOM；心跳类(select 1 from dual)已过滤。</div>
    <div id="sqllist"></div>`;
  host.innerHTML=html;
  const list=host.querySelector('#sqllist');
  data.items.forEach(it=>{
    const div=document.createElement('div'); div.className='sqlcard';
    // 高风险 + 线程 retained 大 = OOM 元凶强证据，徽标醒目
    const big = it.risk==='risky' && parseBytes(it.threadRetained) > 50*1048576; // >50MB
    div.innerHTML=`<div class="sqlhead">${badge(it.risk)}
        <span class="sqlthread">🧵 ${esc(it.threadName)}</span>
        <span class="tret ${big?'big':''}">retained ${esc(it.threadRetained||'-')}</span>
        <span class="sqlsrc">${esc(it.source)}</span></div>
      <pre class="sqltext">${esc(it.sql)}</pre>
      <div class="sqlmeta">${big?'<b style="color:var(--err)">⚠ 该线程 retained 很大 + 高风险 SQL → 疑似 OOM 元凶</b> · ':''}${esc(it.reason)} · <span class="sqlframe">${esc(it.frame)}</span></div>`;
    div.onclick=()=>selectObj({objectId:it.objectId, label:it.source}, div);
    div.oncontextmenu=(e)=>rowMenu(e,{objectId:it.objectId});
    list.appendChild(div);
  });
  host.querySelector('#riskyOnly').onchange=(e)=>{ tab.params.onlyRisky=e.target.checked; renderView(); };
}

/* OOM 复合诊断（mat_diagnose_oom）：summary 头条 + 三路 section（OOM诊断/SQL风险/Leak Suspects） */
async function renderDiagnoseOom(host){
  host.innerHTML='<div class="loading">运行复合诊断（OOM触发线程 + SQL风险 + Leak Suspects，含 leakhunter 全图分析，真实后端为异步任务）…</div>';
  let data;
  try{ data=await API.diagnoseOom(); }
  catch(e){ host.innerHTML='<div class="note" style="color:var(--err)">诊断失败：'+esc(e.message)+'</div>'; return; }
  const s=data.summary||{};
  const verdictColor={sql_oom:'var(--err)',thread_culprit:'var(--err)',leak_suspect:'var(--warn)',victim:'var(--warn)',unclear:'var(--muted)'}[s.verdict]||'var(--muted)';
  const verdictLabel={sql_oom:'SQL 触发 OOM',thread_culprit:'线程元凶',leak_suspect:'内存泄漏嫌疑',victim:'受害者线程',unclear:'证据不足'}[s.verdict]||s.verdict;

  // 头条结论
  let html=`<div class="oombanner ${s.verdict==='victim'||s.verdict==='leak_suspect'?'victim':'culprit'}">
    <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:6px">
      <span class="pill" style="color:${verdictColor};font-weight:700">🧪 ${esc(verdictLabel)}</span>
      <span class="pill">置信度 ${esc(s.confidence||'-')}</span>
      <span style="color:var(--muted)">触发线程 ${s.triggerThreadCount||0} · 高风险SQL ${s.riskySqlCount||0}/${s.sqlTotal||0}</span>
    </div>
    <div style="font-size:13px;line-height:1.7">${esc(s.headline||'')}</div>
    ${s.recommendation?`<div class="leakmeta" style="margin-top:8px;color:var(--accent)">👉 ${esc(s.recommendation)}</div>`:''}
  </div>`;

  const sec=data.sections||{};
  // section 1：OOM 触发线程
  const oom=sec.oomDiagnosis||{};
  html+=`<h3 style="margin:14px 16px 4px;color:var(--accent2)">① OOM 触发线程（总堆 ${esc(oom.totalHeap||'-')}）</h3>`;
  if(oom.triggerThreads&&oom.triggerThreads.length){
    oom.triggerThreads.forEach(t=>{
      html+=`<div class="leakcard ${t.verdict==='culprit'?'leak':''}" data-tid="${t.threadId}">
        <div class="leakhead">
          <span class="pill" style="color:${t.verdict==='culprit'?'var(--err)':'var(--warn)'}">${t.verdict==='culprit'?'元凶':'受害者'}</span>
          <b>${esc(t.threadName||'')}</b>
          <span style="color:var(--muted)">retained ${esc(t.retained||'-')}（${t.percentHeap||0}%）</span></div>
        <div class="leakmeta">${esc(t.reason||'')}<br>触发帧：<code>${esc(t.triggerFrame||'-')}</code></div>
      </div>`;
    });
  } else html+='<div class="note" style="margin:0 16px">未识别明确触发线程。</div>';
  if(oom.culpritHint) html+=`<div class="note" style="margin:6px 16px;color:var(--warn)">真元凶线索：<b>${esc(oom.culpritHint.threadName)}</b> retained ${esc(oom.culpritHint.retained)}（${oom.culpritHint.percentHeap}%）— ${esc(oom.culpritHint.note||'')}</div>`;

  // section 2：SQL 风险
  const sql=sec.sqlInThreads||{};
  html+=`<h3 style="margin:14px 16px 4px;color:var(--accent2)">② 线程栈中的 SQL（${sql.risky||0} 条高风险 / 共 ${sql.total||0}）</h3>`;
  if(sql.items&&sql.items.length){
    sql.items.forEach(h=>{
      const rc={risky:'var(--err)',unknown:'var(--warn)',harmless:'var(--muted)'}[h.risk]||'var(--muted)';
      html+=`<div class="leakcard ${h.risk==='risky'?'leak':''}">
        <div class="leakhead"><span class="pill" style="color:${rc}">${esc(h.risk)}</span>
          <b>${esc(h.threadName||'')}</b>
          <span style="color:var(--muted)">retained ${esc(h.threadRetained||'-')}</span></div>
        <div class="leakstack" style="color:var(--fg)">${esc(h.sql||'')}</div>
        <div class="leakmeta">${esc(h.reason||'')}</div>
      </div>`;
    });
  } else html+='<div class="note" style="margin:0 16px">线程栈中未提取到 SQL。</div>';

  // section 3：Leak Suspects
  const leak=sec.leakSuspects||{};
  html+=`<h3 style="margin:14px 16px 4px;color:var(--accent2)">③ Leak Suspects</h3>`;
  if(leak.conclusion) html+=`<div class="note" style="margin:0 16px">${esc(leak.conclusion)}</div>`;
  if(leak.suspects&&leak.suspects.length){
    leak.suspects.forEach(sp=>{
      html+=`<div class="leakcard"><div class="leakhead"><span class="pill" style="color:var(--warn)">嫌疑</span>
        <b>${esc(sp.label||'')}</b><span style="color:var(--muted)">retained ${esc(sp.retained||'-')}（${sp.percentHeap||0}%）</span></div>
        <div class="leakmeta">累积点：${esc(sp.accumulationPoint||'-')}</div></div>`;
    });
  } else if(!leak.conclusion) html+='<div class="note" style="margin:0 16px">无明显嫌疑（或后端返回 composite 结构，前端按需展开）。</div>';

  html+=`<div class="note" style="margin:12px 16px;color:var(--muted)">${esc(data.note||'')}</div>`;
  host.innerHTML=html;
  host.querySelectorAll('.leakcard[data-tid]').forEach(c=>c.onclick=()=>selectObj({objectId:parseInt(c.dataset.tid),label:'thread'},c));
}

function renderOqlResult(host, data, view){
  if(data.kind==='empty'){ host.innerHTML='<div class="note">无结果。</div>'; return; }
  if(data.kind==='scalar'){ host.innerHTML='<div class="note">标量结果：<b>'+esc(data.value)+'</b></div>'; return; }

  // ★ 结果集复用条：拿到 resultSetId → 可对这批对象再换角度分析（分析流灵魂）
  const rsBar = (rsId) => rsId ? `<div class="rsbar">
      <span>结果集 <code>${esc(rsId)}</code> — 对这批对象：</span>
      <button data-rs-hist="${rsId}">📈 Histogram</button>
      <button data-rs-ret="${rsId}">📦 Retained Set</button>
    </div>` : '';
  const wireRsBar = (root) => {
    const h=root.querySelector('[data-rs-hist]'); if(h) h.onclick=()=>openView('histogramOfRS',{rs:h.dataset.rsHist});
    const r=root.querySelector('[data-rs-ret]'); if(r) r.onclick=async()=>{
      const d=await API.retainedSet(r.dataset.rsRet); toast('Retained set: '+(d.retained||d.total||'见结果')); };
  };

  // 直方图视图：复用 histogram 表样式
  if(data.kind==='histogram'){
    const h=data.histogram; const max=Math.max(...h.rows.map(r=>r.shallowBytes),1);
    let html=rsBar(data.resultSetId)+`<div class="note">OQL 结果 ${data.resultObjects} 个对象，按类聚合（${h.rows.length} 类，排序：${h.sort}）</div>
      <div class="ghead"><div class="gc name">Class</div>
        <div class="gc num" style="width:80px">Objects</div>
        <div class="gc num" style="width:110px">Shallow</div>
        <div class="gc num" style="width:110px">Retained</div></div>`;
    h.rows.forEach(r=>{ const w=Math.round(r.shallowBytes/max*100);
      html+=`<div class="grow" data-cid="${r.classId}"><div class="gc name">${esc(r.label)}
          <div class="bar"><i style="width:${w}%"></i></div></div>
        <div class="gc num" style="width:80px">${r.count}</div>
        <div class="gc num" style="width:110px">${r.shallow}</div>
        <div class="gc num" style="width:110px">${r.retained}${r.retainedApprox?' <span class="approx">≈</span>':''}</div></div>`;
    });
    host.innerHTML=html; wireRsBar(host);
    return;
  }
  // 对象列表视图
  if(data.kind==='objectList'){
    let html=rsBar(data.resultSetId)+`<div class="note">${data.totalRows} 个对象${data.truncated?'（已截断）':''}。右键行可联动；切到"直方图"视图按类聚合。</div>
      <div class="ghead"><div class="gc name">Object</div>
        <div class="gc num" style="width:110px">Shallow</div>
        <div class="gc num" style="width:110px">Retained</div></div><div id="olrows"></div>`;
    host.innerHTML=html; wireRsBar(host);
    const wrap=host.querySelector('#olrows');
    data.rows.forEach(r=>{
      const div=document.createElement('div'); div.className='grow';
      div.innerHTML=`<div class="gc name">${esc(r.label)}</div>
        <div class="gc num" style="width:110px">${r.shallow||''}</div>
        <div class="gc num" style="width:110px">${r.retained||''}</div>`;
      div.onclick=()=>selectObj(r, div);
      div.oncontextmenu=(e)=>rowMenu(e, r);
      wrap.appendChild(div);
    });
  }
}

/* ---------- 选中 + Inspector ---------- */
async function selectObj(o, rowEl){
  State.selected=o;
  document.querySelectorAll('.grow.sel').forEach(e=>e.classList.remove('sel'));
  if(rowEl && rowEl.classList) rowEl.classList.add('sel');
  const insp=document.getElementById('inspector');
  insp.innerHTML='<h3>Inspector</h3><div class="loading">加载详情…</div>';

  // 拉对象详情（类对象也拉——为了显示静态字段+类信息）
  let d = o;
  try { d = await API.object(o.objectId); } catch(e){ d = {...o, _err:e.message}; }

  const refLink = (id, text) => id>=0
    ? `<a href="#" class="reflink" data-id="${id}">${esc(text)}</a>`
    : esc(text);

  let html = `<h3>Inspector ${d.gcRoot?'<span class="pill" style="background:#3a2f1a;color:var(--warn)">GC Root</span>':''}</h3>
    <div class="kv">
      <div class="k">label</div><div class="v">${esc(d.label||o.label||'')}</div>
      <div class="k">id / addr</div><div class="v">${d.objectId}${d.address?' · '+esc(d.address):''}</div>
      <div class="k">type</div><div class="v">${esc(d.type||o.type||'')}</div>
      <div class="k">shallow</div><div class="v">${d.shallow||o.shallow||'-'}</div>
      <div class="k">retained</div><div class="v">${d.retained||o.retained||'-'}</div>
    </div>`;

  // 语义值（String/char[]/URL 等的内容，含 Unicode）—— 醒目显示
  if(d.value!=null && d.value!==''){
    html += `<h3>Value</h3><div class="valbox">${esc(d.value)}</div>`;
  }

  // 类信息（点进类对象时）
  if(d.kind==='class'){
    html += `<div class="kv">
      <div class="k">instances</div><div class="v">${d.instances??'-'}</div>
      ${d.superclass?`<div class="k">superclass</div><div class="v">${esc(d.superclass)}</div>`:''}</div>`;
  }
  // 数组信息
  if(d.kind==='primitiveArray' || d.kind==='objectArray'){
    html += `<div class="kv"><div class="k">length</div><div class="v">${d.length??'-'}</div></div>`;
  }

  // 字段表（实例字段 / 静态字段）—— 带 Type 列 + 搜索 + 排序，渲染容器，逻辑在 renderFieldTable
  const fieldTable = (id, title, list) => {
    if(!list || !list.length) return '';
    return `<h3>${title} (${list.length})</h3>
      <input class="field-search" data-for="${id}" placeholder="🔎 按字段名/值搜索…">
      <div class="ftbl" id="${id}">
        <div class="fhead">
          <div class="fc type" data-sort="type">Type</div>
          <div class="fc name" data-sort="name">Name</div>
          <div class="fc val"  data-sort="value">Value</div>
        </div>
        <div class="fbody"></div>
      </div>`;
  };
  // 把字段数据存到 State，供搜索/排序重渲染
  State.fieldData = { fields: normFields(d.fields), statics: normFields(d.staticFields) };
  State.fieldSort = State.fieldSort || { fields:{key:'name',asc:true}, statics:{key:'name',asc:true} };
  html += fieldTable('tbl-fields', 'Fields', d.fields);
  html += fieldTable('tbl-statics', 'Static Fields', d.staticFields);
  // 基本类型数组元素
  if(d.elements && d.elements.items){
    html += `<h3>Elements (${d.elements.total}${d.elements.truncated?'+':''})</h3>
      <div class="v" style="font-family:var(--mono);font-size:11px;word-break:break-all">[${d.elements.items.join(', ')}]</div>`;
  }

  // 出引用
  if(d.outbound && d.outbound.items){
    html += `<h3>Outgoing (${d.outbound.total}${d.outbound.truncated?'+':''})</h3><div class="reflist">` +
      d.outbound.items.map(r=>`<div class="refrow" data-id="${r.objectId}">
        <span class="rn">${esc(r.name||'')}</span> ${refLink(r.objectId, r.label|| ('#'+r.objectId))}</div>`).join('') +
      (d.outbound.truncated?'<div class="more">…还有更多（懒加载）</div>':'') + `</div>`;
  }

  // 入引用（谁引用我 —— 泄漏归因关键）
  if(d.inbound && d.inbound.items){
    html += `<h3>Incoming (${d.inbound.total}${d.inbound.truncated?'+':''})</h3><div class="reflist">` +
      d.inbound.items.map(r=>`<div class="refrow">${refLink(r.objectId, r.label|| ('#'+r.objectId))}</div>`).join('') +
      (d.inbound.truncated?'<div class="more">…还有更多（懒加载）</div>':'') + `</div>`;
  }

  if(d._err) html += `<div class="note" style="color:var(--err)">详情加载失败：${esc(d._err)}</div>`;

  html += `<h3>动作</h3><div class="insp-actions">
      <button data-a="path2gc">🔗 Path to GC Roots</button>
      <button data-a="outbound">➡ Outgoing References (新Tab)</button>
      <button data-a="inbound">⬅ Incoming References (新Tab)</button>
      <button data-a="histogramOfSet">📈 Histogram of this set</button>
    </div>`;
  insp.innerHTML = html;

  // 引用可点 → 选中那个对象（Inspector 跟着刷新，像 MAT 一样钻取）
  insp.querySelectorAll('.reflink, .refrow[data-id]').forEach(el=>{
    el.onclick=(e)=>{ e.preventDefault();
      const id = parseInt(el.dataset.id || el.querySelector('.reflink')?.dataset.id);
      if(!isNaN(id)) selectObj({objectId:id, label:el.textContent.trim()});
    };
  });
  insp.querySelectorAll('.insp-actions [data-a]').forEach(b=>b.onclick=()=>doAction(b.dataset.a, o));

  // 字段表：首次渲染 + 绑定搜索/排序
  renderFieldTable('tbl-fields', State.fieldData.fields, 'fields');
  renderFieldTable('tbl-statics', State.fieldData.statics, 'statics');
  insp.querySelectorAll('.field-search').forEach(inp=>{
    inp.oninput=()=>{
      const id=inp.dataset.for;
      const which = id==='tbl-fields'?'fields':'statics';
      renderFieldTable(id, State.fieldData[which], which, inp.value.trim().toLowerCase());
    };
  });
  insp.querySelectorAll('.ftbl .fhead .fc[data-sort]').forEach(h=>{
    h.onclick=()=>{
      const id=h.closest('.ftbl').id;
      const which = id==='tbl-fields'?'fields':'statics';
      const s=State.fieldSort[which];
      if(s.key===h.dataset.sort) s.asc=!s.asc; else { s.key=h.dataset.sort; s.asc=true; }
      const searchVal=(insp.querySelector(`.field-search[data-for="${id}"]`)?.value||'').trim().toLowerCase();
      renderFieldTable(id, State.fieldData[which], which, searchVal);
    };
  });
}

/* 字段数据归一化（兼容 {name,value,type,isRef,refId} 与旧的 [name,value] 数组） */
function normFields(list){
  if(!list) return [];
  return list.map(f => (typeof f==='object' && !Array.isArray(f))
    ? {name:f.name, type:f.type||'', value:String(f.value), isRef:!!f.isRef, refId:f.refId??-1}
    : {name:f[0], type:'', value:String(f[1]), isRef:false, refId:-1});
}

/* 渲染字段表：按 filter 过滤 + 按 State.fieldSort 排序，引用值可点 */
function renderFieldTable(tblId, data, which, filter){
  const tbl=document.getElementById(tblId); if(!tbl) return;
  const body=tbl.querySelector('.fbody'); if(!body) return;
  const s=State.fieldSort[which];
  // 排序表头：高亮当前列 + 文字加方向箭头（用 data-label 存原始名，避免箭头叠加）
  tbl.querySelectorAll('.fhead .fc[data-sort]').forEach(c=>{
    c.dataset.label = c.dataset.label || c.textContent.replace(/[▲▼\s]+$/,'').trim();
    const dir = (c.dataset.sort===s.key) ? (s.asc?' ▲':' ▼') : '';
    c.textContent = c.dataset.label + dir;
    c.classList.toggle('sorted', c.dataset.sort===s.key);
  });
  let rows=data.slice();
  if(filter) rows=rows.filter(f=>f.name.toLowerCase().includes(filter)||f.value.toLowerCase().includes(filter));
  rows.sort((a,b)=>{
    const va=(a[s.key]||'').toLowerCase(), vb=(b[s.key]||'').toLowerCase();
    return (va<vb?-1:va>vb?1:0)*(s.asc?1:-1);
  });
  body.innerHTML = rows.length ? rows.map(f=>`
    <div class="frow">
      <div class="fc type">${esc(f.type)}</div>
      <div class="fc name">${esc(f.name)}</div>
      <div class="fc val">${f.isRef&&f.refId>=0?`<a href="#" class="reflink" data-id="${f.refId}">${esc(f.value)}</a>`:esc(f.value)}</div>
    </div>`).join('') : `<div class="frow"><div class="fc" style="color:var(--muted)">无匹配字段</div></div>`;
  // 重新绑定值里的引用链接
  body.querySelectorAll('.reflink').forEach(a=>a.onclick=(e)=>{e.preventDefault();
    const id=parseInt(a.dataset.id); if(!isNaN(id)) selectObj({objectId:id,label:a.textContent.trim()});});
}

/* ---------- 右键菜单 + 视图联动（MAT 体验的灵魂） ---------- */
function rowMenu(ev, o){
  ev.preventDefault();
  closeMenu();
  const m=document.createElement('div'); m.className='ctx';
  m.style.left=Math.min(ev.clientX, innerWidth-220)+'px';
  m.style.top=Math.min(ev.clientY, innerHeight-260)+'px';
  const items = o.isClass
    ? [['list','📋 List objects of class'],['sep'],['path2gc','🔗 Merge paths to GC roots'],['dominator','🌲 Show in dominator']]
    : [['inspect','🔍 Inspect'],['path2gc','🔗 Path to GC roots'],['sep'],
       ['outbound','➡ Outgoing refs'],['inbound','⬅ Incoming refs'],['sep'],['histogramOfSet','📈 Histogram of set']];
  m.innerHTML=items.map(it=> it[0]==='sep'?'<div class="sep"></div>':`<div class="mi" data-a="${it[0]}">${it[1]}</div>`).join('');
  document.body.appendChild(m);
  m.querySelectorAll('[data-a]').forEach(mi=>mi.onclick=()=>{ closeMenu(); doAction(mi.dataset.a, o); });
}
function doAction(a, o){
  if(a==='inspect') return selectObj(o);
  if(a==='path2gc') return openView('path2gc',{objectId:o.objectId});
  if(a==='dominator') return openView('dominator');
  if(a==='outbound') return openView('outbound',{objectId:o.objectId});
  if(a==='inbound') return openView('outbound',{objectId:o.objectId}); // 原型共用
  if(a==='histogramOfSet') return openView('histogramOfSet',{set:o.objectId});
  if(a==='list') return openView('histogram',{}); // 原型示意
  toast('动作: '+a+'（原型示意）');
}
function closeMenu(){ document.querySelectorAll('.ctx').forEach(e=>e.remove()); }
document.addEventListener('click', closeMenu);

/* ---------- 杂项 ---------- */
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function sleep(ms){ return new Promise(r=>setTimeout(r,ms)); }
function toast(msg){ const t=document.createElement('div'); t.className='toast'; t.textContent=msg;
  document.body.appendChild(t); setTimeout(()=>t.remove(),1800); }

/* 左侧菜单 */
document.querySelectorAll('#nav .item').forEach(it=>it.onclick=()=>{
  document.querySelectorAll('#nav .item').forEach(x=>x.classList.remove('active'));
  it.classList.add('active'); openView(it.dataset.view);
});

/* 连接真实后端 */
document.getElementById('connectBtn').onclick=async()=>{
  State.base=document.getElementById('baseUrl').value.trim();
  State.dumpDir=document.getElementById('dumpDir').value.trim();
  try{
    const r=await fetch(State.base+'/health'); const j=await r.json();
    if(j.status==='ok'){ State.live=true;
      document.getElementById('modeBadge').className='badge live';
      document.getElementById('modeBadge').textContent='LIVE 真实后端';
      toast('已连接 query-service'); renderView();
    }
  }catch(e){ toast('连接失败：'+e.message+'（继续用 MOCK）'); }
};

/* 启动 */
openView('overview');
</script>
